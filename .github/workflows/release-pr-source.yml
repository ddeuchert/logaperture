# main only moves when a release is cut, by a pull request from develop. The
# repository ruleset on main requires this check, so a pull request into main
# from any other branch (or from a fork) can't be merged.
name: Release PR source

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  from-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request comes from develop
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != develop ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into main must come from $GITHUB_REPOSITORY:develop, not $HEAD_REPO:$HEAD_REF."
            exit 1
          fi
