name: Release

# Cut a release by pushing a tag: `git tag -a v0.1.0-alpha.1 -m ... && git push origin v0.1.0-alpha.1`
# (from `main`). This builds and signs the release, publishes it to Maven Central
# (issue #186), then publishes a GitHub Release with the zip attached (issue #25), and its
# .sha256 and .asc next to it (issue #202).
# Run the Maven Central dry run (central.yml) first.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the release and upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Derive and check the version
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pom_version="$(./mvnw -B -q --no-transfer-progress help:evaluate \
            -Dexpression=project.version -DforceStdout | tail -1 | tr -d '[:space:]')"
          if [ "$version" != "$pom_version" ]; then
            echo "::error::tag $tag implies version '$version' but the pom is '$pom_version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-alpha*|*-beta*|*-rc*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)                      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Build the offline user guide
        # Rendered into site/, which logaperture-dist copies into the zip's docs/ folder.
        # OFFLINE=true makes it open from disk with no network requests
        # (doc/specs/user-documentation.md, U7).
        env:
          NO_MKDOCS_2_WARNING: 'true'
          OFFLINE: 'true'
          DOCS_VERSION: ${{ steps.v.outputs.version }}
          DOCS_PRERELEASE: ${{ steps.v.outputs.prerelease == 'true' && steps.v.outputs.version || '' }}
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict

      - name: QuarkusIT on the tested Quarkus version
        # doc/specs/quarkus-support.md Q6: the release always runs the Quarkus profile. It is the one
        # integration test this workflow runs; the CI job has the full version matrix.
        run: |
          ./mvnw -B --no-transfer-progress -Pquarkus -pl logaperture-it -am verify \
            -Dit.test=QuarkusIT -Dfailsafe.failIfNoSpecifiedTests=false \
            -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Build, test and sign
        # -am pulls in the agent/cli and their deps; it does NOT pull in
        # logaperture-it, so the WildFly Testcontainers IT (already run on the
        # develop merge) doesn't re-run here. The release profile signs everything
        # and deploys to target/staging, never to Maven Central directly
        # (doc/specs/maven-central-publishing.md).
        # ./mvnw, not the runner's mvn: the runner image's Maven changes under us (3.10 stamped
        # every zip entry 1980-02-01, issue #207). Every jar and zip entry is dated the tagged
        # commit's time, the same on any rebuild of the tag.
        env:
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B --no-transfer-progress -Prelease -pl logaperture-dist -am deploy \
            -Dproject.build.outputTimestamp="$(git log -1 --format=%cI)" \
            -DaltDeploymentRepository=staging::file:target/staging

      - name: Bundle and check for Maven Central
        run: .github/scripts/central.sh bundle target/staging "${{ steps.v.outputs.version }}" target/central-bundle.zip

      - name: Checksum and signature for the GitHub Release
        # Made here, before anything is published, so a failure still leaves nothing permanent
        # (issue #202). The .asc is the signature just bundled for Central; cmp makes sure it
        # signs the same bytes the GitHub Release attaches.
        working-directory: logaperture-dist/target
        run: |
          version="${{ steps.v.outputs.version }}"
          zip="logaperture-$version.zip"
          staged="$GITHUB_WORKSPACE/target/staging/org/logaperture/logaperture/$version"
          cmp "$zip" "$staged/$zip"
          cp "$staged/$zip.asc" .
          sha256sum "$zip" > "$zip.sha256"
          sha256sum -c "$zip.sha256"

      - name: Upload to the Central Portal and wait for validation
        id: central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          id="$(.github/scripts/central.sh upload target/central-bundle.zip "logaperture ${{ steps.v.outputs.version }}")"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Uploaded deployment $id"
          .github/scripts/central.sh wait "$id"

      # The one step that can't be undone: a published version stays on Maven Central for good.
      # Everything before it can be fixed and the tag pushed again.
      - name: Publish to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          .github/scripts/central.sh publish "${{ steps.central.outputs.id }}"
          .github/scripts/central.sh wait "${{ steps.central.outputs.id }}" published

      - name: Extract the changelog section
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { grab=1; next }
            grab && /^## \[/       { exit }
            grab                   { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md." > release-notes.md
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="logaperture-dist/target/logaperture-${{ steps.v.outputs.version }}.zip"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${{ steps.v.outputs.version }}" \
            --notes-file release-notes.md \
            --prerelease="${{ steps.v.outputs.prerelease }}" \
            "$zip" "$zip.sha256" "$zip.asc"
