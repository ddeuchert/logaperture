name: CI

on:
  push:
    branches: [develop, main, 'release/**']
  pull_request:

jobs:
  build:
    # ubuntu-latest ships a running Docker daemon, so Testcontainers works here.
    # logaperture-it's WildFly IT self-skips anywhere Docker is absent
    # (@Testcontainers(disabledWithoutDocker = true)), so a local `mvn verify`
    # without Docker still passes — this job is where it actually runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and verify
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload failure surefire/failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/*-reports/'
          if-no-files-found: ignore

  quarkus:
    # doc/specs/quarkus-support.md Q4, Q6: QuarkusIT (the agent) and QuarkusExtensionIT
    # (doc/specs/quarkus-extension.md #9) against the tested minor and the current LTS stream. The
    # samples, the extension and the ITs are behind the `quarkus` profile, so the `build` job above
    # stays as fast as before. No Docker needed: the ITs run `java -jar quarkus-run.jar`.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quarkus-version: ['3.39.5', '3.33.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: QuarkusIT and QuarkusExtensionIT on Quarkus ${{ matrix.quarkus-version }}
        run: |
          ./mvnw -B --no-transfer-progress -Pquarkus -Dquarkus.version=${{ matrix.quarkus-version }} \
            -pl logaperture-it -am verify \
            -Dit.test='Quarkus*IT' -Dfailsafe.failIfNoSpecifiedTests=false \
            -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload failure surefire/failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-test-reports-${{ matrix.quarkus-version }}
          path: '**/target/*-reports/'
          if-no-files-found: ignore

  log4j2:
    # doc/specs/log4j2-adapter.md A11 and Slice 8 (M8-1, M8-3): the adapter module's tests and
    # BundledLog4j2*IT, in a real process, on a short set of Log4j versions. The floor (2.20.0) is listed
    # explicitly, not left to the default; 2.25.3 and 2.25.5 are both ends of the trim exception (A4).
    # 2.25.5 also runs in the two asynchronous modes. The full set is the nightly (log4j2-nightly.yml).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {log4j2-version: '2.20.0', mode: sync}
          - {log4j2-version: '2.24.3', mode: sync}
          - {log4j2-version: '2.25.3', mode: sync}
          - {log4j2-version: '2.25.5', mode: sync}
          - {log4j2-version: '2.25.5', mode: async-loggers}
          - {log4j2-version: '2.25.5', mode: async-appender}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Log4j ${{ matrix.log4j2-version }}, ${{ matrix.mode }}
        run: |
          ./mvnw -B --no-transfer-progress -pl logaperture-adapter-log4j2,logaperture-agent -am verify \
            -Dlog4j2.version=${{ matrix.log4j2-version }} -Dlog4j2.mode=${{ matrix.mode }} \
            -Dtest='org/logaperture/adapter/log4j2/*Test' -Dit.test='BundledLog4j2*IT' \
            -Dsurefire.failIfNoSpecifiedTests=false -Dfailsafe.failIfNoSpecifiedTests=false

      - name: Upload failure surefire/failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log4j2-test-reports-${{ matrix.log4j2-version }}-${{ matrix.mode }}
          path: '**/target/*-reports/'
          if-no-files-found: ignore

  bench-smoke:
    # doc/specs/overhead-benchmarks.md Decision #4: every benchmark runs once, with no threshold,
    # so a scenario that throws or silently installs nothing fails here. The published numbers
    # come from a quiet machine (logaperture-bench/run-bench.sh), never from a shared runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build the benchmarks
        run: ./mvnw -B --no-transfer-progress -Pbench -pl logaperture-bench -am package -DskipTests

      - name: Run every benchmark once
        run: |
          mkdir -p bench-smoke
          java -jar logaperture-bench/target/benchmarks.jar -foe true -f 1 -wi 0 -i 1 -r 100ms \
            -rf json -rff bench-smoke/smoke.json

      - name: Write the report from the smoke results
        run: |
          java -cp logaperture-bench/target/benchmarks.jar org.logaperture.bench.Report bench-smoke
          cat bench-smoke/report.md >> "$GITHUB_STEP_SUMMARY"
