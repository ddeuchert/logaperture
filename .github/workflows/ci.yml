name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    # ubuntu-latest ships a running Docker daemon, so Testcontainers works here.
    # logaperture-it's WildFly IT self-skips anywhere Docker is absent
    # (@Testcontainers(disabledWithoutDocker = true)), so a local `mvn verify`
    # without Docker still passes — this job is where it actually runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and verify
        run: mvn -B --no-transfer-progress verify

      - name: Upload failure surefire/failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/*-reports/'
          if-no-files-found: ignore
