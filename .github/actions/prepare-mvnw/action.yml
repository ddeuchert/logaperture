# Makes ./mvnw ready before the build step: restores the Maven distribution the wrapper
# downloads (setup-java's `cache: maven` covers ~/.m2/repository only) and, when it is not
# cached, downloads it with retries, so a transient failure of repo.maven.apache.org does not
# fail the job (issue #381). Use it right after setup-java.
name: Prepare the Maven wrapper
description: Cache the Maven distribution that ./mvnw downloads and retry the download.

runs:
  using: composite
  steps:
    - name: Cache the Maven wrapper distribution
      uses: actions/cache@v4
      with:
        path: ~/.m2/wrapper
        key: mvnw-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

    - name: Download Maven, retrying
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if ./mvnw -B --version; then
            exit 0
          fi
          echo "::warning::./mvnw --version failed (attempt $attempt of 3); retrying"
          sleep $((attempt * 15))
        done
        echo "::error::the Maven wrapper could not be prepared after 3 attempts"
        exit 1
