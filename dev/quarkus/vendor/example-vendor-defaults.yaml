# A vendor defaults file for trying the feature in the Quarkus dev environment:
#
#   python3 dev/quarkus/quarkusctl.py up --vendor-defaults dev/quarkus/vendor/example-vendor-defaults.yaml
#
# Quarkus names its handlers `console` and (with --file-log) `file`. The sample's
# own loggers are org.logaperture.sample.quarkus.Worker (JBoss Logging) and
# org.logaperture.sample.quarkus.Jul (java.util.logging); GET /log logs through both.
# Format: doc/specs/vendor-defaults.md.
schemaVersion: 1

loggers:
  - name: org.logaperture.sample.quarkus.Worker
    level: DEBUG

handlers:
  - name: console
    level: INFO

rules:
  - id: repeat-noise
    action: drop
    logger: org.logaperture.sample.quarkus.Worker
    messageContains: "REPEAT-line"
    below: WARN
