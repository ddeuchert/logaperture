# A vendor defaults file for trying the feature in the dev environment:
#
#   python3 dev/wildfly/wildflyctl.py up --vendor-defaults dev/wildfly/vendor/example-vendor-defaults.yaml
#
# The vend.* loggers don't exist until something logs through them; the sample
# app creates any of them on demand, e.g.
#   curl "http://localhost:8080/logaperture-sample-war/log?logger=vend.Health&message=ping+ok"
# Format: doc/specs/vendor-defaults.md.
schemaVersion: 1

loggers:
  - name: vend.Quiet
    level: WARN
  - name: vend.Chatty
    level: DEBUG

handlers:
  - name: CONSOLE
    level: WARN

rules:
  - id: ping-noise
    action: drop
    logger: vend.Health
    messageContains: "ping ok"
    below: WARN
  - id: connect-trace
    action: trim
    logger: vend.Client
    throwable: java.net.ConnectException
    below: FATAL
    frames: 0
