# doc/specs/quarkus-extension.md #1: lower the build-time logging floor so `logctl set logger X TRACE`
# works without a rebuild. This file has ordinal 100; the application's own application.properties
# (250) wins, so `quarkus.log.min-level=DEBUG` there keeps Quarkus's default floor.
quarkus.log.min-level=TRACE
